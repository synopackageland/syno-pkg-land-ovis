services:
  ovis:
    image: ghcr.io/synopackageland/syno-pkg-land-ovis-runtime:0.5.1-0004@sha256:54ac6c1a7f558b999af0d12e11a47d4791b41c1072df75113802a220f8702c35
    entrypoint: [/usr/bin/tini, --, /opt/ovis/ovis-launch]
    environment:
      HOST: '0.0.0.0'
      PORT: '37317'
      OVIS_WORKSPACE: /data/workspace
      XDG_CONFIG_HOME: /data/home/config
      HERDR_SOCKET: /data/home/config/herdr/herdr.sock
      OVIS_STATE_DIR: /data/home/ovis
      OVIS_NO_OPEN: '1'
      OVIS_TAILSCALE_SERVE_ONLY: '1'
      OVIS_AUTO_UPDATE: '0'
      NPM_CONFIG_PREFIX: /data/home/.local
      PATH: /data/home/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    mem_limit: 2g
    cpu_shares: 512
    restart: unless-stopped
    stop_grace_period: 30s
