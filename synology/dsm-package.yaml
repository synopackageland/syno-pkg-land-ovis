# Ovis for DSM: the upstream Ovis web app (a browser and phone client for the
# herdr terminal multiplexer) behind DSM administrator sign-in. The NAS is the
# always-on "connection server": it reaches the herdr sessions on other PCs
# over SSH (Settings > Remote PCs). It runs no herdr or agents of its own.
# `synopkgland build` reads this file.
schema: 2

package: Ovis
version: 0.1.0
# The build resets to 1 with every upstream release (INFO <upstream>-0001).
build: 1
displayname: Ovis
description: Herdr's coding agents in your browser and on your phone, served from your NAS.
# Upstream's app icon (public/icons/icon-512.png); the build scales it to every
# size DSM loads.
icon: assets/icon.png
# The original project is the maintainer; Syno Package Land is the distributor.
maintainer: devswha
os_min_ver: "7.2.1-69057"
# Bun, the upstream runtime, ships Linux builds for x86_64 and aarch64 only.
arches: [x86_64, aarch64]

# The DSM menu icon and Package Center's Open start the gateway entry, which
# signs a DSM administrator in and forwards to Ovis's own web app. There is no
# SDK window: Ovis's web app is the only UI.
ui: false
entry: admin-only

# The small SDK CGI behind the DSM entry policy.
backend:
  kind: go
  dir: backend
  main: ./cmd/app

# The gateway's public HTTPS port is chosen in the install wizard.
install:
  ports: true

daemon:
  # ovis-launch creates the per-install OVIS_TOKEN (package-private, 0600),
  # then execs the packaged Bun on upstream's server/index.ts (`bun run server`).
  exec: ovis-launch
  targets:
    x86_64: daemon/x86_64
    aarch64: daemon/aarch64
  env:
    # Loopback only: the DSM identity gateway is the one way in.
    HOST: "127.0.0.1"
    PORT: "37317"
    OVIS_STATE_DIR: "${SYNOPKG_PKGVAR}/ovis"
    # No local herdr on the NAS; this keeps the local row's error stable and
    # inside the package's own folder.
    HERDR_SOCKET: "${SYNOPKG_PKGVAR}/herdr/herdr.sock"
    # Anonymous usage counts are off in this package. Upstream sends them by
    # default; this env setting wins over the in-app switch.
    OVIS_TELEMETRY: "0"
    OVIS_NO_OPEN: "1"
    # Package Center owns versions: server/index.ts has no self-updater (that
    # is server/managed.ts, which needs a Git checkout), and auto-update stays off.
    OVIS_AUTO_UPDATE: "0"
  restart: {mode: on-failure}
  timeouts:
    start: 60
    stop: 30
    status: 5
    uninstall: 60

identity_gateway:
  sdk: 0.50.16
  # A DSM administrator signs in; the fixed token adapter then supplies Ovis's
  # own proxy credential (Authorization: Bearer <OVIS_TOKEN>), the sign-in
  # proxy setup upstream documents. The browser never receives the token, and
  # there is no second App password.
  mode: token
  access: dsm-admins
  upstream: 37317
  # Ovis serves its app, API (/api), terminal (/ws), service worker and
  # manifest at the root and has no base-path setting, so it gets a dedicated
  # HTTPS port (DSM's certificate) instead of a DSM path.
  listen:
    https: 27317
  token:
    exec: ovis-token
  # No upstream_auth_paths: every Ovis route, /ws and push included, uses the
  # same injected token behind the DSM gate.

metadata:
  license: MIT
  homepage: https://ovis.sh/
  source_url: https://github.com/devswha/ovis
  issues_url: https://github.com/devswha/ovis/issues
  maintainer_url: https://github.com/devswha/ovis
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
  upstream:
    name: ovis
    url: https://github.com/devswha/ovis
  long_description:
    en: |-
      Ovis brings the coding agents on your computers to your browser and phone:
      chats, prompt and approval cards, push alerts and the live terminal, for
      herdr sessions. On DSM it runs as the always-on connection server: add your
      PCs under Settings > Remote PCs and Ovis reaches their herdr sessions over
      SSH. The NAS runs no agents itself. Administrators open it from the DSM main
      menu. Anonymous usage counts are off in this package (OVIS_TELEMETRY=0), and
      updates come only from Package Center.
    zh-TW: |-
      Ovis 把電腦上的 coding agent 帶到瀏覽器和手機：對話、提示與核准卡片、推播
      通知和即時終端機，適用於 herdr 工作階段。在 DSM 上它是一直開機的連線伺服器：
      在 Settings > Remote PCs 加入電腦，Ovis 便透過 SSH 連到這些電腦的 herdr 工作
      階段。NAS 本身不執行 agent。管理員從 DSM 主選單開啟。此套件關閉匿名使用統計
      （OVIS_TELEMETRY=0），更新只透過套件中心

i18n:
  messages: i18n/messages
  glossary: i18n/glossary.json
  info:
    zh-TW: { description: "在瀏覽器和手機上使用 herdr 的 coding agent，由你的 NAS 提供服務" }
    zh-CN: { description: "在浏览器和手机上使用 herdr 的 coding agent，由你的 NAS 提供服务" }
    ja: { description: "herdr のコーディングエージェントをブラウザーとスマートフォンで。NAS から提供" }
    ko: { description: "herdr의 코딩 에이전트를 브라우저와 휴대폰에서. NAS에서 제공" }
    de: { description: "Die Coding-Agenten von herdr im Browser und auf dem Smartphone, bereitgestellt von Ihrem NAS" }
    fr: { description: "Les agents de code de herdr dans votre navigateur et sur votre téléphone, servis par votre NAS" }
    es: { description: "Los agentes de código de herdr en tu navegador y tu teléfono, servidos desde tu NAS" }
    it: { description: "Gli agenti di coding di herdr nel browser e sul telefono, serviti dal tuo NAS" }

capabilities: {}
