# Ovis for DSM: the upstream Ovis web app (a browser and phone client for the
# herdr terminal multiplexer) behind DSM administrator sign-in. All local
# shells, agents, herdr and Ovis run inside the package container. Remote PCs
# are reached over SSH (Settings > Remote PCs).
# `synopkgland build` reads this file.
schema: 2

package: Ovis
version: 0.5.1
# The build resets to 1 with every upstream release (INFO <upstream>-0001).
build: 5
displayname: Ovis
description: Herdr's coding agents in your browser and on your phone, served from your NAS.
# Upstream's sheep (app/assets/ovis-sheep.png), unchanged, on a rounded DSM-style
# tile (assets/icon/, variant b of assets/make-icon.py), drawn per size so
# 16, 24 and 32 px use a fuller tile with no drop shadows.
icon: assets/icon
# The original project is the maintainer; Syno Package Land is the distributor.
maintainer: devswha
os_min_ver: "7.2.1-69057"
# Bun, the upstream runtime, and herdr ship Linux builds for x86_64 and aarch64 only.
arches: [x86_64, aarch64]

# The DSM menu icon and Package Center's Open start the gateway entry, which
# signs a DSM administrator in and forwards to Ovis's own web app. There is no
# SDK window: Ovis's web app is the only UI.
ui: {launch: new-page}
entry: admin-only

# The gateway's public HTTPS port is chosen in the install wizard.
install:
  # No hard minimum. Below about 85% of 4 GB (4 GB machines report about 3.7 GB)
  # the install wizard warns, without blocking, to run agents on a remote PC
  # (i18n/messages: install.recommended_memory_message).
  recommended_memory_mb: 3400
  ports: true
  sharedFolder: {mode: select, key: data, permission: rw, picker: folder}

# The runtime uses only the fixed package identity and selected NAS folder.
compose:
  sdk: 0.53.26
  files: [compose.yaml]
  helpers:
    x86_64: helpers/x86_64
    aarch64: helpers/aarch64
  services:
    ovis:
      # Ovis, herdr, shells and agents run as the package UID; only an explicit
      # `sudo ...` in a terminal runs as container root.
      run_as:
        mode: package
        sudo: {reason: "Install build tools with apt in the Ovis terminal"}
      # The SDK's container init gives the package UID the account `ovis`, HOME,
      # TMPDIR and private credential file modes on every start.
      console: {home: /data/home, user: ovis}
      # Temporary files go to disk, emptied at every start; /tmp stays the
      # image's own directory. No memory tmpfs: DSM's Docker recreates a tmpfs
      # as root 0755 on a container restart, ignoring its declared mode.
      scratch: [/scratch]
      storage_init:
        directories: [{base: /data, path: workspace}]
        runtime:
          environment:
            OVIS_TOKEN: {secret: ovis}
  shares:
    data:
      select: install
      picker: folder
      permission: rw
      mounts: [{service: ovis, target: /data}]
  web:
    service: ovis
    port: 37317
    health: {path: /api/health, status: 200}
  network: {egress: internet}

identity_gateway:
  sdk: 0.53.26
  # A DSM administrator signs in; the fixed token adapter then supplies Ovis's
  # own proxy credential (Authorization: Bearer <OVIS_TOKEN>), the sign-in
  # proxy setup upstream documents. The browser never receives the token, and
  # there is no second App password.
  mode: token
  access: dsm-admins
  # Ovis serves its app, API (/api), terminal (/ws), service worker and
  # manifest at the root and has no base-path setting, so it gets a dedicated
  # HTTPS port (DSM's certificate) instead of a DSM path.
  listen:
    https: 27317
  token:
    exec: ovis-token
  # No upstream_auth_paths: every Ovis route, /ws and push included, uses the
  # same injected token behind the DSM gate.

metadata:
  license: MIT
  homepage: https://ovis.sh/
  source_url: https://github.com/devswha/ovis
  issues_url: https://github.com/devswha/ovis/issues
  maintainer_url: https://github.com/devswha/ovis
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
  upstream:
    name: ovis
    url: https://github.com/devswha/ovis
  long_description:
    en: |-
      Ovis brings the coding agents on your computers to your browser and phone:
      chats, prompt and approval cards, push alerts and the live terminal, for
      herdr sessions. On DSM it runs as the always-on connection server: add your
      PCs under Settings > Remote PCs and Ovis reaches their herdr sessions over
      SSH. The NAS also runs a bundled herdr of its own, so its sidebar row works
      and shells and agents run as the package account inside an Ubuntu container.
      HOME and the default workspace use the NAS folder selected during installation.
      It is for DSM administrators only: the icon is shown only to
      administrators, every request goes through the DSM administrator gate,
      and all administrators share one Ovis identity. The Ovis relay and Portal
      are disabled. Anonymous usage counts are off by default (Settings > About can
      turn them on), and updates come only from Package Center
    zh-TW: |-
      Ovis 把電腦上的 coding agent 帶到瀏覽器和手機：對話、提示與核准卡片、推播
      通知和即時終端機，適用於 herdr 工作階段。在 DSM 上它是一直開機的連線伺服器：
      在 Settings > Remote PCs 加入電腦，Ovis 便透過 SSH 連到這些電腦的 herdr 工作
      階段。NAS 本身也執行套件內附的 herdr，所以側欄中 NAS 本機那一列可正常使用；shell 與 agent 在 Ubuntu 容器內以套件帳號執行，HOME 與預設工作區使用安裝時所選的 NAS 資料夾。僅限 DSM 管理員：只有管理員看得到圖示，每個請求都經過
      DSM 管理員驗證，所有管理員共用同一個 Ovis 身分；Ovis relay 與 Portal 已停用。匿名使用統計預設關閉（可在 Settings > About 開啟），更新只透過套件中心

i18n:
  messages: i18n/messages
  glossary: i18n/glossary.json
  info:
    zh-TW: { description: "在瀏覽器和手機上使用 herdr 的 coding agent，由你的 NAS 提供服務" }
    zh-CN: { description: "在浏览器和手机上使用 herdr 的 coding agent，由你的 NAS 提供服务" }
    ja: { description: "herdr のコーディングエージェントをブラウザーとスマートフォンで。NAS から提供" }
    ko: { description: "herdr의 코딩 에이전트를 브라우저와 휴대폰에서. NAS에서 제공" }
    de: { description: "Die Coding-Agenten von herdr im Browser und auf dem Smartphone, bereitgestellt von Ihrem NAS" }
    fr: { description: "Les agents de code de herdr dans votre navigateur et sur votre téléphone, servis par votre NAS" }
    es: { description: "Los agentes de código de herdr en tu navegador y tu teléfono, servidos desde tu NAS" }
    it: { description: "Gli agenti di coding di herdr nel browser e sul telefono, serviti dal tuo NAS" }

capabilities: {composeMounts: true}
